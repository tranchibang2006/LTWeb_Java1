<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Sinh Viên IT</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CSS (Cho thông báo đẹp) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            color: #333;
        }
        .navbar-brand {
            font-weight: 600;
            letter-spacing: 1px;
        }
        .main-card {
            background: #fff;
            border-radius: 15px;
            border: none;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08);
            padding: 25px;
            margin-top: 30px;
        }
        .table {
            vertical-align: middle;
        }
        .table thead th {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            color: #495057;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        .btn-custom-add {
            background-color: #0d6efd;
            color: white;
            border-radius: 8px;
            padding: 8px 20px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-custom-add:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(13, 110, 253, 0.3);
        }
        .action-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .badge-it {
            background-color: #e1f0ff;
            color: #0d6efd;
            font-weight: 500;
            padding: 6px 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- Header (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-graduation-cap me-2 text-warning"></i> 
                ĐẠI HỌC ĐÔNG Á - KHOA CNTT
            </a>
        </div>
    </nav>

    <div class="container">
        <!-- Khung chứa nội dung chính -->
        <div class="main-card">
            <!-- Khu vực Tiêu đề và Nút Thêm -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="mb-0 fw-bold text-secondary">
                    <i class="fa-solid fa-users me-2"></i>Quản Lý Sinh Viên
                </h4>
                <button class="btn btn-custom-add" data-bs-toggle="modal" data-bs-target="#addStudentModal">
                    <i class="fa-solid fa-plus me-1"></i> Thêm Sinh Viên
                </button>
            </div>

            <!-- Bảng Dữ Liệu -->
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Mã SV</th>
                            <th>Họ và Tên</th>
                            <th>Email</th>
                            <th>Số Điện Thoại</th>
                            <th>Lớp</th>
                            <th class="text-center">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Vòng lặp Thymeleaf -->
                        <tr th:each="sv : ${studentList}">
                            <td>
                                <span class="fw-semibold text-primary" th:text="${sv.studentCode}"></span>
                            </td>
                            <td class="fw-medium" th:text="${sv.fullName}"></td>
                            <td th:text="${sv.email}"></td>
                            <td th:text="${sv.phone}"></td>
                            <td>
                                <span class="badge-it" th:text="${sv.className}"></span>
                            </td>
                            <td class="text-center">
                                <!-- Nút Sửa -->
                                <button class="btn btn-light action-btn text-primary me-1" title="Sửa"
                                        th:data-id="${sv.id}" 
                                        onclick="editStudent(this.getAttribute('data-id'))">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                
                                <!-- Nút Xóa -->
                                <button class="btn btn-light action-btn text-danger" title="Xóa"
                                        th:data-id="${sv.id}" 
                                        onclick="deleteStudent(this.getAttribute('data-id'))">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </td>
                        </tr>
                        <!-- Hiển thị khi không có dữ liệu -->
                        <tr th:if="${#lists.isEmpty(studentList)}">
                            <td colspan="6" class="text-center py-4 text-muted">
                                <i class="fa-solid fa-folder-open fs-2 mb-2"></i>
                                <p class="mb-0">Chưa có dữ liệu sinh viên nào.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form Thêm/Sửa Sinh Viên -->
    <div class="modal fade" id="addStudentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light border-bottom-0">
                    <h5 class="modal-title fw-bold text-dark"><i class="fa-solid fa-user-plus me-2 text-primary"></i>Thêm Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="addStudentForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Mã Sinh Viên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="studentCode" required placeholder="VD: IT01">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Họ và Tên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="fullName" required placeholder="VD: Nguyễn Văn A">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="VD: nva@gmail.com">
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label text-muted small fw-semibold">Số điện thoại</label>
                                <input type="text" class="form-control" id="phone" placeholder="090...">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted small fw-semibold">Lớp</label>
                                <input type="text" class="form-control" id="className" placeholder="VD: IT24A">
                            </div>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary py-2 fw-semibold">
                                <i class="fa-solid fa-save me-1"></i> Lưu Dữ Liệu
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & SweetAlert2 Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Script xử lý Logic CRUD -->
    <script>
        // Biến toàn cục để nhận biết đang Thêm mới hay Sửa
        let currentEditId = null;

        // 1. TÍNH NĂNG XÓA (DELETE)
        function deleteStudent(id) {
            Swal.fire({
                title: 'Xóa sinh viên này?',
                text: "Dữ liệu sẽ không thể khôi phục!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Đồng ý xóa',
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Gọi API DELETE
                    fetch('/api/students/' + id, {
                        method: 'DELETE'
                    }).then(response => {
                        if(response.ok) {
                            Swal.fire('Đã xóa!', 'Dữ liệu đã được cập nhật.', 'success')
                            .then(() => window.location.reload());
                        }
                    });
                }
            });
        }

        // 2. TÍNH NĂNG SỬA (UPDATE) - Đổ dữ liệu cũ lên Modal
        function editStudent(id) {
            currentEditId = id; // Lưu lại ID đang sửa
            
            // Gọi API GET lấy thông tin 1 sinh viên
            fetch('/api/students/' + id)
                .then(response => response.json())
                .then(student => {
                    // Đổ dữ liệu vào form
                    document.getElementById('studentCode').value = student.studentCode;
                    document.getElementById('fullName').value = student.fullName;
                    document.getElementById('email').value = student.email;
                    document.getElementById('phone').value = student.phone;
                    document.getElementById('className').value = student.className;
                    
                    // Đổi tiêu đề Modal và mở lên
                    document.querySelector('.modal-title').innerHTML = '<i class="fa-solid fa-pen text-primary me-2"></i>Cập nhật thông tin';
                    var myModal = new bootstrap.Modal(document.getElementById('addStudentModal'));
                    myModal.show();
                });
        }

        // 3. TÍNH NĂNG LƯU (Xử lý chung cho cả THÊM MỚI và SỬA)
        document.getElementById('addStudentForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            const studentData = {
                studentCode: document.getElementById('studentCode').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                className: document.getElementById('className').value
            };

            // Xác định là gọi API POST (Thêm) hay PUT (Sửa)
            const url = currentEditId ? '/api/students/' + currentEditId : '/api/students';
            const method = currentEditId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(studentData)
            })
            .then(response => {
                if(response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Thành công!',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        window.location.reload(); 
                    });
                } else {
                    Swal.fire({ icon: 'error', title: 'Lỗi', text: 'Kiểm tra lại dữ liệu nhập vào!' });
                }
            });
        });

        // Reset Form khi bấm nút "Thêm Sinh Viên" (Tránh dính dữ liệu cũ khi vừa bấm Sửa xong)
        document.querySelector('.btn-custom-add').addEventListener('click', function() {
            currentEditId = null;
            document.getElementById('addStudentForm').reset();
            document.querySelector('.modal-title').innerHTML = '<i class="fa-solid fa-user-plus text-primary me-2"></i>Thêm Mới';
        });
    </script>
</body>
</html>
